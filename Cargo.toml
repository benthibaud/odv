[workspace]
members = [
    "crates/odv-core",
    "crates/odv-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ben Thibaud <b_thibaud@laposte.net>"]

[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.vello_common]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.skrifa]
opt-level = 3

[profile.dev.package.stylo]
opt-level = 2
